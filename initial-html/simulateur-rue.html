<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Et si on essayait le revenu universel d’existence ?</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d2330;--mu:#5d6574;--ln:#d9d6cc;--ac:#1f5f8b;--ok:#1d7a4d;--ko:#b3402a;--wa:#fff4d6}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--tx:#e8eaee;--mu:#9aa3b2;--ln:#343b48;--ac:#6fb1e0;--ok:#5bc58f;--ko:#ef8a74;--wa:#3a3320}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
header{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 20px;flex-wrap:wrap}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 8px;color:var(--ac)}
main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;padding:0 20px 24px;max-width:1100px;margin:auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}.g label{display:flex;flex-direction:column;font-size:12.5px;color:var(--mu)}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:5px 7px;width:100%}
input[type=checkbox]{width:auto}.ck{flex-direction:row!important;gap:6px;align-items:center;display:block;}
.sticky{position:sticky;top:10px}.big{font-size:28px;font-weight:700}.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted var(--ln)}
.bar{height:14px;border-radius:4px;background:var(--ac);margin:3px 0 8px;min-width:2px}.bar.n{background:var(--mu)}
.pos{color:var(--ok)}.neg{color:var(--ko)}.lang button{padding:4px 10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);cursor:pointer}
.lang button.on{background:var(--ac);color:var(--bg)}.warn{background:var(--wa);border-radius:6px;padding:8px;margin:6px 0;font-size:13px}
nav.tabs{display:flex;gap:6px;padding:0 20px 10px;max-width:1100px;margin:auto}nav.tabs button{flex:1;padding:9px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;cursor:pointer;font:inherit}nav.tabs button.on{background:var(--ac);color:var(--bg);font-weight:600}body[data-tab=soc] .me,body[data-tab=me] .soc{display:none}.dl{display:flex;justify-content:space-between;font-size:13px}.dbar{height:10px;margin:2px 0 9px;display:flex}.dbar i{display:block;height:100%;border-radius:3px}details summary{cursor:pointer;font-weight:600}small{color:var(--mu)}
</style>
</head>
<body>
<header><h1 id="ttl"></h1><div class="lang"><button data-l="fr">FR</button><button data-l="et">ET</button></div></header><nav class="tabs" id="tabs"></nav>
<main><div id="form"></div><div><div class="card sticky me" id="res"></div><div class="card sticky soc" id="res2"></div></div></main>
<footer class="card" id="charte" style="max-width:1060px;margin:0 auto 24px"></footer>
<script>
/* ============================================================
   SIMULATEUR RUE — port fidèle du classeur Excel (feuilles « ET VOUS » + « SIMULATEUR »)
   Les références entre crochets, ex. [SIMULATEUR!F56], renvoient aux cellules d’origine.
   Les formules sont reproduites À L’IDENTIQUE, y compris leurs particularités.
   Les endroits suspects sont marqués « ⚠ KONTROLLI » ; une correction est prête, mais
   désactivée tant que APPLY_SUGGESTED_FIXES / FIX.xxx valent false.
   ============================================================ */
const APPLY_SUGGESTED_FIXES = false;                      // interrupteur général
const FIX = {                                             // ou un par un
  k75:  APPLY_SUGGESTED_FIXES,  // coefficient 0,75 → 0,66 (personne 2, TAN)
  f57:  APPLY_SUGGESTED_FIXES,  // placement du 0,66 dans la cotisation de la personne 2
  f61:  APPLY_SUGGESTED_FIXES,  // dénominateur du taux de prélèvement
  g46:  APPLY_SUGGESTED_FIXES,  // net d’activité de la personne 2 (formule absente)
  pfg:  APPLY_SUGGESTED_FIXES   // progressivité aussi pour les déciles 2 et 3 (onglet société)
};

function calc(p, F = FIX) {
  const ru = p.ru;                                        // [SIMULATEUR!C11:C15] 0-14, 14-18, 18-25, 25+, 65+
  const P = [p.p1, p.p2];
  const ret = P.map(x => x.cat === "r");                  // [E29, E30] retraité.e
  const ruPers = P.map(x => (x.cat === "y" ? ru[2] : 0) + (x.cat === "a" ? ru[3] : 0) + (x.cat === "r" ? ru[4] : 0)); // [F29, F30]
  const ruEnf = p.kids[0] * ru[0] + p.kids[1] * ru[1] + p.kids[2] * ru[2];   // [F32]
  const f52 = ruPers[0] + ruPers[1] + ruEnf;              // [F52] RU du foyer

  // Net d’activité : [ET VOUS!F46] = F45*0,79
  // ⚠ KONTROLLI : dans l’Excel, G46 (personne 2) n’a PAS de formule → vaut 0 si rien n’est saisi.
  //   Correction : G46 = G45*0,79 comme pour la personne 1 (FIX.g46).
  // Personne 1 : [F46] est une formule (0,79 × brut) que l’Excel laisse modifiable ; champ vide = formule d’origine.
  const net = [P[0].net == null ? P[0].brut * 0.79 : P[0].net, F.g46 ? P[1].brut * 0.79 : P[1].net];

  // [F49] Revenu disponible actuel
  const cur = P.reduce((s, x, i) => s + net[i] + x.rpn + x.aides + x.af - x.imp - x.ifi - x.mut, 0);

  // [F53] Revenu net d’activité et du patrimoine avec cotisation de 20 % (codée en dur : 0,8) et pension 66 %
  const f53 = P.reduce((s, x, i) => s + (ret[i] ? 0.8 * (0.66 * x.brut + x.rpb) : 0.8 * (x.brut + x.rpb)), 0);

  // Taux de cotisation [C56, C57] avec progressivité (seuil 1800 €) et TAN [C58, C59] (seuil 3000 €)
  const rate = (i, cMax, prog, seuil, coef) => {
    const x = P[i], b = ret[i] ? coef * x.brut + x.rpb : x.brut + x.rpb;
    return prog && b < seuil ? cMax * (b / seuil) : cMax;
  };
  const c56 = rate(0, p.cot, p.prog1, 1800, 0.66);
  const c57 = rate(1, p.cot, p.prog1, 1800, 0.66);
  const c58 = rate(0, p.tan, p.prog2, 3000, 0.66);
  // ⚠ KONTROLLI : [C59] utilise 0,75 alors que C56–C58 utilisent 0,66 → incohérence probable.
  //   Correction : 0,66 (FIX.k75).
  const c59 = rate(1, p.tan, p.prog2, 3000, F.k75 ? 0.66 : 0.75);

  const f56 = ret[0] ? c56 * (0.66 * P[0].brut + P[0].rpb) : c56 * (P[0].brut + P[0].rpb);
  // ⚠ KONTROLLI : [F57] écrit C57*0,66*(brut+patrimoine) : le 0,66 s’applique aussi aux revenus du
  //   patrimoine, contrairement à F56 qui écrit C56*(0,66*brut+patrimoine).
  //   Correction : C57*(0,66*brut+patrimoine) (FIX.f57).
  const f57 = ret[1]
    ? (F.f57 ? c57 * (0.66 * P[1].brut + P[1].rpb) : c57 * 0.66 * (P[1].brut + P[1].rpb))
    : c57 * (P[1].brut + P[1].rpb);
  const f58 = c58 * P[0].pat / 12;                        // [F58]
  const f59 = c59 * P[1].pat / 12;                        // [F59]
  const f60 = f56 + f57 + f58 + f59;                      // [F60] prélèvement total

  // ⚠ KONTROLLI : [F61] dénominateur = 0,8*(brut+patrimoine) + RU, sans le coefficient 0,66 des
  //   retraités. Correction : F60 / (F52 + F53) (FIX.f61) — identique tant qu’il n’y a pas de retraité.
  const den = F.f61 ? f52 + f53 : 0.8 * P[0].brut + 0.8 * P[1].brut + 0.8 * P[0].rpb + 0.8 * P[1].rpb + f52;
  const f61 = den ? f60 / den : null;

  const f62 = f52 + f53 - f60;                            // [F62] revenu disponible avec le RUE
  const gain = f62 - cur;                                 // [O31]
  return { cur, f62, gain, pct: cur ? gain / cur : null, f52, f53, f60, f61, f56, f57, f58, f59 };
}


/* ============================================================
   ONGLET « POUR LA SOCIÉTÉ » — port de « 3 COMPOSITION » et « 4 BILAN » (premier classeur)
   Données INSEE codées en dur dans l’Excel : reprises telles quelles.
   ============================================================ */
const SOC = { uc:[1.1,1.15,1.21,1.34,1.46,1.59,1.69,1.82,1.9,2,2], nb:[10,10,10,10,10,10,10,10,10,9.9,0.1],  // [BILAN!E7:O8]
  pat:[4500,14000,35000,110000,180000,250000,340000,490000,750000,2000000,10000000],                          // [BILAN!E9:O9]
  brut:[138,1075,1675,2435,3140,4000,4900,6150,8112,15729,105000], aid:[700,500,400,300,250,200,120,80,65,40,0], // [E13:O13, E17:O17]
  imp:[0,0,0,20,30,50,100,200,550,2000,25000], inc:[1050,1080,1100,1150,1184,1230,1240,1245,1247,1250,1250],    // [E18:O18, COMPOSITION!L35:L45]
  w:[3,19,14,25,10,10,5,9,4,1], uce:[1,1,1,1.5,1.8,2.1,2.6,1.8,1.5,2.1], L29:1196.6, HH:31e6 };               // [COMPOSITION!C,I,L29] ; 31 M ménages en dur
function societe(p, F = FIX) {
  const R = p.ru, S_ = SOC, avg = a => a.reduce((s, x, i) => s + x * S_.nb[i], 0) / 100;
  // [COMPOSITION!D17:D27] AUE par foyer-type.
  // ⚠ KONTROLLI : « couple sans enfant » [D20] = C11+C12 (25+ et 65+) alors que les autres couples utilisent 2*C11.
  //   Sans effet tant que 25 ans et plus = 65 ans et plus (1100 € / 1100 €) ; correction : 2*C11.
  const D = [R[2], R[3], R[4], R[3] + R[4], 2*R[3] + R[0], 2*R[3] + 2*R[0], 2*R[3] + 2*R[0] + R[1], R[3] + R[0] + R[1], 2*R[3], 2*R[3] + 2*R[0]];
  const K29 = D.reduce((s, d, i) => s + d * S_.w[i], 0) / S_.uce.reduce((s, u, i) => s + u * S_.w[i], 0);  // [K29] AUE moyen par UC
  const L33 = K29 / S_.L29, aue = S_.inc.map((l, i) => l * L33 * S_.uc[i]);                                // [K35:K45]*[I35:I45] = [BILAN!E27:O27]
  const cur = [], n26 = [], c28 = [], t29 = [], n32 = [], g33 = [], g34 = [];
  for (let i = 0; i < 11; i++) {
    const b = S_.brut[i], pt = S_.pat[i];
    cur[i] = b - 0.12*b - 0.097*b + S_.aid[i] - S_.imp[i];                                                 // [E21] : cot. 12 % + CSG 9,7 %
    n26[i] = b - 0.2*b;                                                                                    // [E26] : cot. 20 % [C25]
    t29[i] = i <= 4 && p.prog2 ? pt * p.tan * b / (3000*12) : p.tan * pt / 12;                              // [E29:O29]
    const prog = i === 0 || (F.pfg && i < 3) ? p.prog1 : false;
    // ⚠ KONTROLLI : [F28, G28] testent PRESENTATION!D19 et E19, cellules VIDES → la progressivité n’agit
    //   que sur le 1er décile. Correction : appliquer C19 aussi aux déciles 2 et 3 (FIX.pfg).
    // ⚠ KONTROLLI : [E28] ajoute « +E18 » (impôt du 1er décile, 0 dans les données) : référence parasite.
    if (i <= 2) c28[i] = (prog ? b * p.cot * b / 1800 : p.cot * b) + (i === 0 ? S_.imp[0] : 0);
    else if (i <= 6) c28[i] = p.cot * b;                                                                   // [H28:K28]
    else c28[i] = (p.cot*b + p.tan*pt/12 > 0.55*(n26[i] + aue[i])) ? 0.55*(n26[i] + aue[i]) - t29[i] : p.cot*b; // [L28:O28] plafond 55 %
    n32[i] = n26[i] - c28[i] - t29[i] + aue[i];                                                            // [E32]
    g33[i] = n32[i] - cur[i]; g34[i] = g33[i] / cur[i];                                                    // [E33, E34]
  }
  const dAue = avg(aue), dC = avg(c28), dT = avg(t29), dN = avg(n26), dCur = avg(cur);
  // ⚠ KONTROLLI : signe de [D31] = prélèvement − AUE, à l’inverse de [E31:O31] = AUE − prélèvement. Reproduit tel quel ; D38 en dépend.
  const d31 = dC + dT - dAue, d35 = p.af / (12 * S_.HH), d36 = p.tva / (12 * S_.HH);
  const bal = d31 + d35 + d36;                                                                             // [D38] excédent/déficit moyen par ménage et par mois
  const rich = -(g33[9]*12*0.099*S_.HH + g33[10]*12*0.001*S_.HH);                                          // [PRESENTATION!C33] contribution des 10 % les plus riches
  return { aue, cur, net: n32, g33, g34, dAue, dCur, dNet: dN - dC - dT + dAue, bal, balPct: bal / dAue, rich, richPct: rich / (dAue*12*S_.HH), K29 };
}

/* ---------------- Interface ---------------- */
const T = {
 fr: { ttl:"Et si on essayait le revenu universel d’existence ?", amounts:"1° Montant du RUE par mois et par âge", a0:"0-14 ans",a1:"14-18 ans",a2:"18-25 ans",a3:"25 ans et plus",a4:"65 ans et plus",
  rates:"2° Taux de contribution", cot:"Cotisation sur le revenu brut (%)", prog1:"Progressivité : rev. brut < 1 800 €", tan:"Taxe sur les actifs nets (%)", prog2:"Progressivité : rev. brut < 3 000 €",
  home:"3° Composition du foyer", cat:"Situation", y:"18-25 ans", a:"> 25 ans", r:"Retraité·e", none:"— (personne absente)", kids:"Enfants au foyer", k0:"0-14 ans", k1:"14-18 ans", k2:"18-25 ans",
  inc:"4° Revenus mensuels, patrimoine, aides et impôts", p1:"Personne 1", p2:"Personne 2", brut:"Revenu brut d’activité (€)", net:"Revenu d’activité net de cotisations (€)", pat:"Patrimoine net d’emprunt (€)", rpb:"Revenus du patrimoine bruts (€)", rpn:"Revenus du patrimoine nets (€)", aides:"Aides sociales (€)", af:"Allocations familiales (€)", imp:"Impôt sur le revenu (€)", ifi:"I.F.I. (€)", mut:"Mutuelle (€)",
  res:"Ça changerait quoi pour vous ?", now:"Revenu disponible actuel", tom:"Avec le RUE", gain:"Gain", ruf:"RUE du foyer", contrib:"Votre contribution", rate:"Taux de prélèvement", mo:"/ mois",
  fixes:"Points à vérifier dans le classeur Excel d’origine", fixNote:"Par défaut, les calculs reproduisent l’Excel à l’identique. Cochez pour appliquer la correction suggérée.",
  k75:"Personne 2 : coefficient 0,75 au lieu de 0,66 (taxe sur actifs nets, retraité).", f57:"Personne 2 : le 0,66 s’applique aussi aux revenus du patrimoine (cotisation, retraité).", f61:"Taux de prélèvement : dénominateur sans le coefficient 0,66 des retraités.", g46:"Personne 2 : le net d’activité n’a pas de formule (0,79 × brut pour la personne 1)." },
 et: { ttl:"Mis oleks, kui prooviksime eksistentsi põhisissetulekut?", amounts:"1° Põhisissetuleku (RUE) suurus kuus vanuse järgi", a0:"0–14 a",a1:"14–18 a",a2:"18–25 a",a3:"25 a ja vanem",a4:"65 a ja vanem",
  rates:"2° Sissemaksumäärad", cot:"Sissemakse brutotulult (%)", prog1:"Progressiivsus: brutotulu < 1 800 €", tan:"Netovara maks (%)", prog2:"Progressiivsus: brutotulu < 3 000 €",
  home:"3° Leibkonna koosseis", cat:"Olukord", y:"18–25 a", a:"> 25 a", r:"Pensionär", none:"— (isik puudub)", kids:"Lapsed leibkonnas", k0:"0–14 a", k1:"14–18 a", k2:"18–25 a",
  inc:"4° Igakuine tulu, vara, toetused ja maksud", p1:"Isik 1", p2:"Isik 2", brut:"Tegevustulu bruto (€)", net:"Tegevustulu neto sissemaksetest (€)", pat:"Netovara (laenudest puhastatud) (€)", rpb:"Varatulu bruto (€)", rpn:"Varatulu neto (€)", aides:"Sotsiaaltoetused (€)", af:"Peretoetused (€)", imp:"Tulumaks (€)", ifi:"Varamaks (I.F.I.) (€)", mut:"Täiendav tervisekindlustus (€)",
  res:"Mida see teie jaoks muudaks?", now:"Praegune käepärane tulu", tom:"RUE-ga", gain:"Kasu", ruf:"Leibkonna RUE", contrib:"Teie sissemakse", rate:"Maksukoormus", mo:"/ kuu",
  fixes:"Algses Exceli failis kontrollimist vajavad kohad", fixNote:"Vaikimisi järgivad arvutused Excelit täpselt. Märkige, et rakendada soovitatud parandus.",
  k75:"Isik 2: koefitsient 0,75 asemel 0,66 (netovara maks, pensionär).", f57:"Isik 2: 0,66 rakendub ka varatulule (sissemakse, pensionär).", f61:"Maksukoormus: nimetaja ilma pensionäride koefitsiendita 0,66.", g46:"Isik 2: neto tegevustulu valem puudub (isikul 1: 0,79 × bruto)." }
};
let L = "fr";
const S = { ru:[330,550,1100,1100,1100], cot:28, prog1:false, tan:1.5, prog2:false, kids:[0,0,0],
  p1:{cat:"a",brut:1802,net:0,pat:0,rpb:0,rpn:0,aides:250,af:0,imp:0,ifi:0,mut:0},
  p2:{cat:"",brut:0,net:0,pat:0,rpb:0,rpn:0,aides:0,af:0,imp:0,ifi:0,mut:0} };
const $ = s => document.querySelector(s), t = k => T[L][k];
const num = (v, d = 0) => isFinite(v) ? Number(v).toLocaleString(L === "fr" ? "fr-FR" : "et-EE", { minimumFractionDigits: d, maximumFractionDigits: d }) : "–";
const nf = (id, v, step = 1, ph = "") => `<input type="number" step="${step}" data-id="${id}" value="${v}" placeholder="${ph}">`;
const lab = (k, inner) => `<label>${t(k)}${inner}</label>`;

function render() {
  document.documentElement.lang = L; $("#ttl").textContent = t("ttl");
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l === L));
  const person = (key) => {
    const x = S[key], opts = ["y","a","r"].concat(key === "p2" ? [""] : []).map(c => `<option value="${c}" ${x.cat === c ? "selected" : ""}>${t(c || "none")}</option>`).join("");
    const f = ["brut","net","pat","rpb","rpn","aides","af","imp","ifi","mut"].map(k => lab(k, nf(key + "." + k, x[k], 1, k === "net" && key === "p1" ? t("auto") : ""))).join("");
    return `<div class="card me"><h2>${t(key)}</h2><div class="g">${lab("cat", `<select data-id="${key}.cat">${opts}</select>`)}${f}</div></div>`;
  };
  $("#form").innerHTML = presetCard() +
    `<div class="card"><h2>${t("amounts")}</h2><div class="g">${[0,1,2,3,4].map(i => lab("a" + i, nf("ru." + i, S.ru[i]))).join("")}</div></div>` +
    `<div class="card"><h2>${t("rates")}</h2><div class="g">${lab("cot", nf("cot", S.cot, .1))}${lab("tan", nf("tan", S.tan, .1))}
      <label class="ck"><input type="checkbox" data-id="prog1" ${S.prog1 ? "checked" : ""}>${t("prog1")}</label>
      <label class="ck"><input type="checkbox" data-id="prog2" ${S.prog2 ? "checked" : ""}>${t("prog2")}</label></div></div>` +
    `<div class="card me"><h2>${t("home")}</h2><div class="g">${[0,1,2].map(i => lab("k" + i, nf("kids." + i, S.kids[i]))).join("")}</div></div>` +
    `<h2 class="me" style="margin:4px 2px">${t("inc")}</h2>` + person("p1") + person("p2") +
    `<div class="card me"><details><summary>${t("fixes")}</summary><p><small>${t("fixNote")}</small></p>${["k75","f57","f61","g46"].map(k => `<label class="ck"><input type="checkbox" data-fix="${k}" ${FIX[k] ? "checked" : ""}>${t(k)}</label>`).join("")}</details></div>` + socInputs();
  result(); result2(); tabs(); charter();
}
function result() {
  const p = { ru:S.ru.map(Number), cot:S.cot / 100, tan:S.tan / 100, prog1:S.prog1, prog2:S.prog2, kids:S.kids.map(Number), p1:{ ...num2(S.p1), net: S.p1.net === "" ? null : Number(S.p1.net) || 0 }, p2:num2(S.p2) };
  const r = calc(p), m = Math.max(r.cur, r.f62, 1);
  $("#res").innerHTML = `<h2>${t("res")}</h2>
    <div>${t("now")}<div class="bar n" style="width:${Math.max(0, r.cur / m * 100)}%"></div><b>${num(r.cur, 2)} €</b> ${t("mo")}</div>
    <div>${t("tom")}<div class="bar" style="width:${Math.max(0, r.f62 / m * 100)}%"></div><b>${num(r.f62, 2)} €</b> ${t("mo")}</div>
    <div class="big ${r.gain >= 0 ? "pos" : "neg"}">${r.gain >= 0 ? "+" : ""}${num(r.gain, 2)} € <small>${r.pct === null ? "" : "(" + (r.pct >= 0 ? "+" : "") + num(r.pct * 100, 1) + " %)"}</small></div>
    <div class="row"><span>${t("ruf")}</span><span>${num(r.f52, 2)} €</span></div>
    <div class="row"><span>${t("contrib")}</span><span>${num(r.f60, 2)} €</span></div>
    <div class="row"><span>${t("rate")}</span><span>${r.f61 === null ? "–" : num(r.f61 * 100, 1) + " %"}</span></div>` +
    (S.thr ? `<div class="row"><span>${t("thr")} : ${num(S.thr, 0)} €</span><b class="${r.f62 >= S.thr ? "pos" : "neg"}">${t(r.f62 >= S.thr ? "above" : "below")}</b></div>` : "");
}
const num2 = x => Object.fromEntries(Object.entries(x).map(([k, v]) => [k, k === "cat" ? v : Number(v) || 0]));
document.addEventListener("input", e => {
  const id = e.target.dataset.id; if (!id) return;
  if (/^(p1|p2|kids)/.test(id)) { S.preset = ""; S.thr = 0; const q = $("[data-pre]"); if (q) q.value = ""; }
